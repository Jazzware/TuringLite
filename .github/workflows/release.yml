# Compila y publica el instalador de TuringLite.
# Se lanza al subir una etiqueta vX.Y.Z (git tag v1.0.0 && git push origin v1.0.0) o a mano desde la pestaña Actions.
#
# Con etiqueta: publica un release en GitHub con el instalador y SHA256SUMS.txt.
# A mano: solo compila y guarda el instalador como artefacto de la ejecución.
#
# Las versiones se publican SIN FIRMAR.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # crear el release en GitHub

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar la app
        shell: pwsh
        run: ./release/build-release.ps1 -Stage App

      - name: Compilar el instalador
        shell: pwsh
        run: ./release/build-release.ps1 -Stage Setup

      - name: Comprobar la versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not (Test-Path "dist/TuringLite-Setup-$ver.exe")) {
            throw "La etiqueta ${{ github.ref_name }} no coincide con la versión compilada: $(Get-ChildItem dist -Filter 'TuringLite-Setup-*.exe' | Select-Object -ExpandProperty Name)"
          }

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: TuringLite-Setup
          path: |
            dist/TuringLite-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publicar el release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/release-notes.md
          files: |
            dist/TuringLite-Setup-*.exe
            dist/SHA256SUMS.txt
